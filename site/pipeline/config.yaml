# Paths are evaluated on the gem VM host unless noted.

jupyter_container: jupyter
jupyter_work: /home/jovyan/work
# Host paths
host_gem: /home/ec2-user/gem
host_html_panels: /home/ec2-user/gem/html/panels
host_db: /home/ec2-user/gem/db
host_github: /home/ec2-user/gem/gembot
host_auth: /home/ec2-user/gem/jupyter/auth
host_logs: /home/ec2-user/gem/jupyter/logs

# Inside jupyter container (/home/jovyan/work == ~/gem/jupyter)
container_pipeline: /home/jovyan/work/pipeline
container_work: /home/jovyan/work
container_logs: /home/jovyan/work/logs
container_html_panels: /home/jovyan/html/panels

gembot:
  name: GEM databot
  email: csaladenes.gembot@outlook.com
  remote: github.com/denesdata/gem.git
  branch: main
  token_file: gembott_token.txt   # under host_auth

# Panel globs copied into github/data/panels/ after each job
panels_daily:
  - news.json
  - upcoming.json
  - legal_*.json
  - iso_counties.json

panels_weekly:
  - aps_*.json
  - nes_*.json
  - rostats_*.json
  - ro_stats_*.json
  - regio_*.json
  - regio2_*.json
  - scatter.json
  - romania-*.json
  - eu-nuts2.json
  - news.json
  - upcoming.json
  - legal_*.json
