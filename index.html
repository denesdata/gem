<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6WYJ4XHJJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-R6WYJ4XHJJ');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Global Entrepreneurship Monitor Romania - Research conducted at Babeș-Bolyai University of Cluj-Napoca. Analyzing entrepreneurial attitudes, activity and aspirations in Romania." />
    <meta property="og:image" content="https://gem2.csaladen.es/snapshot.png" />
    <meta property="og:title" content="Global Entrepreneurship Monitor Romania" />
    <meta property="og:url" content="https://econ.ubbcluj.ro/entrepreneurship/" />
    <link rel="shortcut icon" href="https://gem2.csaladen.es/favicon.ico" />
    <title>Global Entrepreneurship Monitor Romania</title>
    <style>
        html, body, iframe {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: transparent;
        }
        /* Legacy Grafana shell — same teal gradient the old gem2 layer painted */
        html.engine-old, html.engine-old body {
            background: #0b5567;
            background: -webkit-linear-gradient(to bottom right, #0b5567, #020a11);
            background: linear-gradient(to bottom right, #0b5567, #020a11);
        }
    </style>
</head>
<body>
    <iframe id="iframe" allow="geolocation" title="GEM Romania"></iframe>
    <script>
        /**
         * gem2 mother (UBB iframe target).
         *   default     → new site  https://gem.csaladen.es
         *   engine=old  → Grafana   https://gem-new.csaladen.es + PDF shortcuts
         * No chrome: child owns load/menu/nav.
         */
        const CHILD_NEW = 'https://gem.csaladen.es';
        const CHILD_OLD = 'https://gem-new.csaladen.es';

        const sectionMapNew = {
            home: 'overview',
            funding: 'funding',
            start: 'entrepreneurship',
            ro: 'romania',
            stats: 'statistics',
            aps: 'aps',
            nes: 'nes',
            news: 'reports',
            about: 'research'
        };
        const sectionMapOld = {
            home: '285',
            funding: '163',
            start: '171',
            ro: '161',
            stats: '169',
            aps: '179',
            nes: '175',
            news: '173',
            about: '66'
        };

        const PDF = {
            Raport2024: 'https://gem-html.csaladen.es/panels/reports/pdf/Raport%20de%20tara%202022-2023_final.pdf',
            Raport2025: 'https://gem-html.csaladen.es/panels/reports/pdf/GEM%20Raport%20de%20tara%202023-2024.pdf',
            Raport2026: 'https://gem-html.csaladen.es/panels/reports/pdf/GEM_RO_Raport_de_tara_2024-2025.pdf'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const fullUrl = window.location.search;
        let targetUrl = '';
        if (fullUrl.includes('url=')) {
            targetUrl = decodeURIComponent(fullUrl.substring(fullUrl.indexOf('url=') + 4));
        }

        const targetParams = targetUrl
            ? new URLSearchParams(targetUrl.replace(/^\?+/, '').replace(/\|/g, '&'))
            : urlParams;
        const useOld = (targetParams.get('engine') || urlParams.get('engine') || '') === 'old';
        const lang = targetParams.get('lang') || 'ro';
        const section = (targetParams.get('section') || '').replace(/=$/, '');
        if (useOld) document.documentElement.classList.add('engine-old');

        // PDF / html shortcuts — always on gem2 (UBB links have no engine=old)
        if (targetUrl) {
            if (PDF[targetUrl]) {
                window.location.replace(PDF[targetUrl]);
                throw new Error('pdf');
            }
            const raw = targetUrl.replace(/^\?+/, '').replace(/\|/g, '&');
            if (raw.startsWith('html=')) {
                window.location.replace('https://gem-html.csaladen.es/' + raw.slice(5));
                throw new Error('html');
            }
        }

        const iframe = document.getElementById('iframe');
        let childSrc;

        if (useOld) {
            const sectionMap = sectionMapOld;
            const queryParams = [];
            if (section && sectionMap[section]) {
                queryParams.push('panel=' + sectionMap[section]);
            }
            targetParams.forEach((value, key) => {
                if (!['lang', 'section', 'url', 'engine', 'panel'].includes(key)) {
                    queryParams.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
                }
            });
            const qs = queryParams.length ? '?' + queryParams.join('&') : '';
            childSrc = CHILD_OLD + '/d/' + lang + '/' + qs;
        } else {
            const sectionMap = sectionMapNew;
            const queryParams = ['lang=' + encodeURIComponent(lang)];
            const sectionId = section && sectionMap[section] ? sectionMap[section] : section;
            if (sectionId) queryParams.push('section=' + encodeURIComponent(sectionId));
            targetParams.forEach((value, key) => {
                if (!['lang', 'section', 'url', 'engine', 'panel'].includes(key)) {
                    queryParams.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
                }
            });
            childSrc = CHILD_NEW + '/?' + queryParams.join('&');
        }

        iframe.src = childSrc;

        if (useOld && section) {
            const mapped = sectionMapOld[section] || section;
            iframe.addEventListener('load', function () {
                [400, 900, 1400].forEach(function (delay) {
                    setTimeout(function () {
                        try {
                            iframe.contentWindow.postMessage(
                                { type: 'scrollToPanel', panelId: mapped },
                                CHILD_OLD
                            );
                        } catch (e) { /* cross-origin */ }
                    }, delay);
                });
            });
        }
    </script>
</body>
</html>
